name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull-request runs, but never interrupt a deployment in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check content (MDX syntax, frontmatter, links, EN/RU twins)
        run: npm run check:content

      - name: Check flashcard decks are up to date
        run: |
          npm run flashcards
          git diff --exit-code -- public/flashcards

      - name: Check diagrams (render, readable width, EN/RU parity)
        run: |
          npx playwright install --with-deps chromium
          npm run check:diagrams

      - name: Build site (also validates the skill map)
        run: npm run build

      - name: Check internal links and anchors
        run: npm run check:links

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
